services:
  - type: web
    name: nexus-rag-backend
    runtime: python
    rootDir: rag_intel_system
    buildCommand: "./build.sh"
    startCommand: "uvicorn core.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
